apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-bucket
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 120
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000}
      containers:
        - name: bucket
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "deploy/container/bucket.mjs"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          envFrom:
            - secretRef: {name: {{ .Values.s3Secret }}}
          env:
            - {name: PRONTO_BUCKET, value: {{ .Values.replica.bucket | quote }}}
            - {name: PRONTO_S3_ENDPOINT, value: {{ .Values.replica.endpoint | quote }}}
            - {name: AWS_REGION, value: {{ .Values.replica.region | quote }}}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
